; Shared commonUtils settings. Logistics: Settings > commonUtils.
; Save edits explicitly. Readers pick up changes on the next wheel event.
; Missing or invalid values use the defaults shown below.

[WheelNavigation]
; Any nonzero vertical movement from a snapped wheel turns exactly one page.
; These notches have no cooldown. Page loading still blocks further turns.
immediate_notches = true
; Smooth scrolling sensitivity multiplier: 1 = old threshold, 20 = 20x easier.
; Allowed range: 1 to 100. Smooth thresholds are 60 pixels or 120 angle units / sensitivity.
sensitivity = 20
; Minimum time between smooth-scroll page turns, in milliseconds (0 to 2000).
cooldown_ms = 250
