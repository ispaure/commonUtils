; Shared commonUtils settings. Logistics: Settings > commonUtils.
; Save edits explicitly. Readers pick up changes on the next wheel event.
; Missing or invalid values use the defaults shown below.

[Styling]
; Empty UI/browser family uses the system font; empty code family uses monospace.
; Personal overrides are edited through the host application's Settings window.
theme_mode = system
accent_color_str = #75a7ff
dark_tint_int = 8
ui_font_family_str =
ui_font_size_int = 11
browser_font_family_str =
browser_font_size_int = 11
reading_font_family_str = Georgia
reading_font_size_int = 15
code_font_family_str =
code_font_size_int = 11

[WheelNavigation]
; Any nonzero vertical movement from a snapped wheel turns exactly one page.
; These notches have no cooldown. Page loading still blocks further turns.
immediate_notches = true
; Smooth scrolling sensitivity multiplier: 1 = old threshold, 20 = 20x easier.
; Allowed range: 1 to 100. Smooth thresholds are 60 pixels or 120 angle units / sensitivity.
sensitivity = 100
; Minimum time between smooth-scroll page turns, in milliseconds (0 to 2000).
cooldown_ms = 30

[FileBrowser]
; Default for new tabs. The Preview button can override it for the current tab.
preview_enabled = true

[Storage]
# Short zoom transitions when opening folders or returning to their parent.
radial_animations_bool = true

[Menus]
; macOS: true uses the system menu bar; false puts menus inside windows.
; Applies to open and new tools after saving (within half a second).
; Windows/Linux always keep menus in their windows.
macos_native_bool = true
